name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # 暂时禁用 Linux 构建 - 依赖安装问题
          # - os: ubuntu-latest
          #   artifact: DearTs-linux-x86_64
          #   binary_dir: build/bin
          #   binary_name: DearTs
          #   zip_command: zip
          - os: windows-latest
            artifact: DearTs-windows-x86_64
            binary_dir: build/bin/Release
            binary_name: DearTs.exe
            zip_command: 7z

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ubuntu: 安装 SDL3 依赖
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libudev-dev \
            libpulse-dev \
            libsndio-dev \
            libxss-dev \
            libxtst-dev

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir release
          copy ${{ matrix.binary_dir }}/${{ matrix.binary_name }} release\
          # 复制所有依赖的 DLL 文件
          copy ${{ matrix.binary_dir }}/*.dll release\ -ErrorAction SilentlyContinue
          # 复制 SDL3 DLL
          if (Test-Path "third_party/SDL/Release/SDL3.dll") {
            copy third_party/SDL/Release/SDL3.dll release\
          }
          # 复制 FreeType DLL
          if (Test-Path "third_party/freetype/Release/freetype.dll") {
            copy third_party/freetype/Release/freetype.dll release\
          }
          # 复制 resources 文件夹
          if (Test-Path "${{ matrix.binary_dir }}/resources") {
            Copy-Item -Path "${{ matrix.binary_dir }}/resources" -Destination "release\resources" -Recurse
          }

      - name: Prepare Release Directory (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir release
          cp ${{ matrix.binary_dir }}/${{ matrix.binary_name }} release/
          # 复制共享库文件
          find ${{ matrix.binary_dir }} -name "*.so" -o -name "*.dylib" | xargs -I {} cp {} release/ || true
          # 复制 resources 文件夹
          if [ -d "${{ matrix.binary_dir }}/resources" ]; then
            cp -r ${{ matrix.binary_dir }}/resources release/
          fi

      - name: Create ZIP Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd release
          7z a ../${{ matrix.artifact }}.zip *

      - name: Create ZIP Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd release
          zip -r ../${{ matrix.artifact }}.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
